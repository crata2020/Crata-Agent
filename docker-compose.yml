services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crata_ai_office}
      POSTGRES_USER: ${POSTGRES_USER:-crata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crata_local_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - crata_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crata -d crata_ai_office"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crata_postgres_data:
